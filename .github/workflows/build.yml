name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tracker-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tracker logic test
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc tests/tracker_test.cpp -o "$RUNNER_TEMP/tracker_test"
          "$RUNNER_TEMP/tracker_test"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libobs-dev libopencv-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: obs-face-blur-linux
          path: build/dist/obs-face-blur
