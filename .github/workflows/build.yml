name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tracker-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tracker logic test
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc tests/tracker_test.cpp -o "$RUNNER_TEMP/tracker_test"
          "$RUNNER_TEMP/tracker_test"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libobs-dev libopencv-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: obs-face-blur-linux
          path: build/dist/obs-face-blur

  windows:
    runs-on: windows-2022
    env:
      OBS_VERSION: "31.1.1"
      # OpenCV из Chocolatey (готовые бинарники, включая opencv_world*.dll)
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV
        shell: pwsh
        run: |
          choco install opencv --no-progress -y
          $cfg = Get-ChildItem -Path C:\tools\opencv -Recurse -Filter OpenCVConfig.cmake | Select-Object -First 1
          if (-not $cfg) { throw "OpenCVConfig.cmake not found" }
          Write-Host "OpenCV config: $($cfg.FullName)"
          "OpenCV_DIR=$($cfg.DirectoryName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Get OBS sources
        shell: pwsh
        run: git clone --depth 1 --branch $env:OBS_VERSION https://github.com/obsproject/obs-studio.git "$env:RUNNER_TEMP\obs-src"

      - name: Download OBS prebuilt dependencies
        shell: pwsh
        run: |
          $spec = Get-Content "$env:RUNNER_TEMP\obs-src\buildspec.json" -Raw | ConvertFrom-Json
          $ver = $spec.dependencies.prebuilt.version
          $url = "$($spec.dependencies.prebuilt.baseUrl)/$ver/windows-deps-$ver-x64.zip"
          Write-Host "obs-deps: $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\deps.zip"
          Expand-Archive "$env:RUNNER_TEMP\deps.zip" -DestinationPath "$env:RUNNER_TEMP\obs-deps"

      - name: Helper for readable build errors
        shell: pwsh
        run: |
          @'
          function Invoke-Logged([string]$Title, [scriptblock]$Cmd) {
            $log = Join-Path $env:RUNNER_TEMP ("log-" + ($Title -replace '\W','_') + ".txt")
            & $Cmd *> $log
            $code = $LASTEXITCODE
            Get-Content $log | Select-Object -Last 15
            if ($code) {
              $errs = Select-String -Path $log -Pattern 'error|CMake Error|fatal|not found|LNK\d+' -CaseSensitive:$false |
                      Select-Object -First 12 | ForEach-Object { $_.Line.Trim() }
              if (-not $errs) { $errs = Get-Content $log | Select-Object -Last 12 }
              $msg = ($errs -join "%0A")
              Write-Host "::error title=$Title failed::$msg"
              throw "$Title failed (exit $code)"
            }
          }
          '@ | Set-Content "$env:RUNNER_TEMP\helpers.ps1"

      - name: Build libobs
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $src = "$env:RUNNER_TEMP\obs-src"; $deps = "$env:RUNNER_TEMP\obs-deps"
          $bld = "$env:RUNNER_TEMP\obs-build"; $prefix = "$env:RUNNER_TEMP\obs-prefix"
          Invoke-Logged "libobs configure" { cmake -S $src -B $bld -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$deps" "-DCMAKE_INSTALL_PREFIX=$prefix" -DENABLE_PLUGINS=OFF -DENABLE_FRONTEND=OFF -DENABLE_SCRIPTING=OFF -DENABLE_UI=OFF -DENABLE_BROWSER=OFF -DENABLE_VLC=OFF -DENABLE_WEBSOCKET=OFF -DENABLE_NEW_MPEGTS_OUTPUT=OFF }
          Invoke-Logged "libobs build" { cmake --build $bld --config Release --parallel }
          Invoke-Logged "libobs install" { cmake --install $bld --config Release }

      - name: Build plugin
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $deps = "$env:RUNNER_TEMP\obs-deps"; $prefix = "$env:RUNNER_TEMP\obs-prefix"
          $cfgs = Get-ChildItem $prefix -Recurse -Include "*Config.cmake","*-config.cmake" | ForEach-Object { $_.FullName.Substring($prefix.Length) }
          Write-Host "::notice title=Installed cmake configs::$($cfgs -join ' | ')"
          $extra = @()
          foreach ($pkg in "libobs","w32-pthreads") {
            $f = Get-ChildItem $prefix -Recurse -Include "${pkg}Config.cmake","${pkg}-config.cmake" | Select-Object -First 1
            if ($f) { $extra += "-D${pkg}_DIR=$($f.DirectoryName)" }
          }
          Invoke-Logged "plugin configure" { cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$prefix;$deps" @extra }
          Invoke-Logged "plugin build" { cmake --build build --config Release --parallel }

      - name: Show plugin folder
        shell: pwsh
        run: Get-ChildItem -Recurse build\dist | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: obs-face-blur-windows
          path: build/dist/obs-face-blur
